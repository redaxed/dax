<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07130f" />
    <meta
      name="description"
      content="Dax's personal corner of the internet, taking shape in Seattle."
    />

    <meta property="og:title" content="Dax — Seattle" />
    <meta
      property="og:description"
      content="A personal corner of the internet, currently taking shape in Seattle."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dax.seattle.wa.us/" />

    <title>Dax — Seattle</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <div class="aurora aurora-one"></div>
      <div class="aurora aurora-two"></div>
      <div class="grain"></div>
    </div>

    <main class="shell">
      <header class="masthead">
        <a class="wordmark" href="/" aria-label="Dax home">
          <span class="wordmark-mark">D</span>
          <span>DAX</span>
        </a>
        <p class="status"><span></span> Site in progress</p>
      </header>

      <section class="hero" aria-labelledby="hero-title">
        <p class="eyebrow">47.6062° N · 122.3321° W</p>
        <h1 id="hero-title">A new home<br />on the web.</h1>
        <p class="intro">
          Hi, I’m Dax. This is my small corner of the internet, currently
          taking shape in Seattle.
        </p>
        <div class="details" aria-label="Site details">
          <div>
            <span class="detail-label">Local time</span>
            <time id="seattle-time">Pacific Time</time>
          </div>
          <div>
            <span class="detail-label">Address</span>
            <span>dax.seattle.wa.us</span>
          </div>
        </div>
      </section>

      <footer>
        <p>More soon.</p>
        <p class="signal" aria-label="Online"><span></span> Seattle, WA</p>
      </footer>
    </main>
  </body>
</html>
